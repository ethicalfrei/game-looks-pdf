<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Game looks</title>
  <style>
    body { margin: 0; background: #111; color: #f4efe6; font: 18px/1.4 Georgia, serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-weight: normal; font-size: 40px; margin: 0 0 8px; }
    p { margin: 0 0 18px; }
    figure { margin: 0 0 36px; }
    img { width: 100%; height: auto; display: block; background: #000; }
    figcaption { padding: 10px 2px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Game looks</h1>
    <p>Nia and Reed, painted into each game. Bubble is unchanged.</p>
    <figure>
      <img src="muggin-idle.png" alt="Muggin, both fighters standing" />
      <figcaption>Muggin, standing. The stray leg between them is gone.</figcaption>
    </figure>
    <figure>
      <img src="muggin-kick.png" alt="Muggin, Nia in a full split kick" />
      <figcaption>Muggin, the kick. The whole pose stays in the frame.</figcaption>
    </figure>
    <figure>
      <img src="downbeat-color.png" alt="Downbeat in color, Nia and Reed" />
      <figcaption>Downbeat, technicolor. They replace the fighters.</figcaption>
    </figure>
    <figure>
      <img src="downbeat-ink.png" alt="Downbeat in ink, Nia and Reed" />
      <figcaption>Downbeat, ink. Same people, drawn in ink.</figcaption>
    </figure>
    <figure>
      <img src="downbeat-groove.png" alt="Downbeat in gray, Nia and Reed" />
      <figcaption>Downbeat, groove. The color drawings, in gray.</figcaption>
    </figure>
    <figure>
      <img src="prix.png" alt="Small Prix, Nia and Reed as the drivers' heads" />
      <figcaption>Small Prix. Their heads are the dolls' heads.</figcaption>
    </figure>
    <figure>
      <img src="prix-chase.png" alt="Small Prix from the race camera" />
      <figcaption>Small Prix, from the race camera. The heads turn so you can see them.</figcaption>
    </figure>
  </main>
</body>
</html>
